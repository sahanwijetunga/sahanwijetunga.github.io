<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Image Click Through</title>
  <style>
    body { text-align: center; font-family: sans-serif; }
    img { max-width: 90%; height: auto; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Click the Image to Cycle</h1>
  <img id="slideshow" src="img1.jpg" alt="Slideshow Image" onclick="nextImage()">

  <script>
    const images = ["img1.jpg", "img2.jpg", "img3.jpg"];
    let current = 0;

    function nextImage() {
      current = (current + 1) % images.length;
      document.getElementById("slideshow").src = images[current];
    }
  </script>
</body>
</html>
